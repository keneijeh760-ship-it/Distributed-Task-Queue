name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskqueue
          POSTGRES_PASSWORD: taskqueue
          POSTGRES_DB: taskqueue
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U taskqueue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - name: Test
        run: go test -count=1 ./...
